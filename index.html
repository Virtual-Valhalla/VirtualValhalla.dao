<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VirtualValhalla</title>

<meta name="description" content="Decentralized infrastructure gateway">
<meta property="og:title" content="VirtualValhalla">
<meta property="og:description" content="Infrastructure • Streaming • Automation • AI Ops">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Background grid */

.grid{
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.15;
}

/* Glow */

.glow{
    position:fixed;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    filter:blur(60px);
    animation:pulse 6s infinite alternate;
}

/* Main */

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:90%;
    max-width:900px;
}

.logo{
    font-size:4rem;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:15px;
}

.line{
    width:120px;
    height:2px;
    background:white;
    margin:0 auto 25px auto;
    opacity:0.7;
}

.subtitle{
    font-size:1.1rem;
    opacity:0.75;
    margin-bottom:40px;
    line-height:1.7;
}

/* Status */

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid rgba(255,255,255,0.15);
    padding:12px 18px;
    border-radius:999px;
    background:rgba(255,255,255,0.03);
    margin-bottom:35px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00ff88;
    animation:blink 1.2s infinite;
}

/* Buttons */

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.button{
    padding:14px 28px;
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    text-decoration:none;
    transition:0.25s;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
}

.button:hover{
    background:white;
    color:black;
}

/* Footer */

.footer{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    text-align:center;
    opacity:0.35;
    font-size:0.85rem;
    letter-spacing:2px;
}

/* Animations */

@keyframes blink{
    50%{
        opacity:0.2;
    }
}

@keyframes pulse{
    from{
        transform:scale(1);
        opacity:0.2;
    }
    to{
        transform:scale(1.15);
        opacity:0.45;
    }
}

/* Mobile */

@media(max-width:700px){

    .logo{
        font-size:2.2rem;
        letter-spacing:4px;
    }

    .subtitle{
        font-size:1rem;
    }

    .buttons{
        flex-direction:column;
    }

    .button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="glow"></div>

<div class="container">

    <div class="logo">
        VIRTUALVALHALLA
    </div>

    <div class="line"></div>

    <div class="subtitle">
        Decentralized infrastructure gateway.<br>
        Streaming • Automation • AI Ops • Open Systems
    </div>

    <div class="status">
        <div class="dot"></div>
        <span>NODE ONLINE</span>
    </div>

    <div class="buttons">

        <!-- CAMBIA ESTA IP CUANDO QUIERAS -->
        <a class="button" href="https://75.119.145.5">
            ENTER NODE
        </a>

        <a class="button" href="#">
            DOCUMENTATION
        </a>

        <a class="button" href="#">
            STATUS
        </a>

    </div>

</div>

<div class="footer">
    VIRTUALVALHALLA.DAO
</div>

</body>
</html>
